name: meetkai

# Main / cockpit box. WAHA lives in docker-compose.waha.yml; morphik,
# morphik-postgres, crawl4ai (and their redis) live in docker-compose.workers.yaml.
# The cockpit reaches those services over the network via the KAI_* URLs, so
# they are not defined here.

networks:
  odyssey:

volumes:
  kai-data:
  kai-postgres-data:
  kai-vendor:
  kai-models:

services:
  kai-postgres:
    image: postgres:18
    container_name: kai-postgres
    hostname: kai-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${KAI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KAI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${KAI_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - kai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KAI_POSTGRES_USER} -d ${KAI_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - odyssey

  cockpit:
    image: ghcr.io/malvavisc0/meetkai-cockpit:${KAI_IMAGE_TAG:-latest}
    pull_policy: always
    user: appuser
    container_name: cockpit
    hostname: cockpit
    restart: unless-stopped
    command: kai cockpit serve --host 0.0.0.0 --port 8080
    expose:
      - "8080"
    volumes:
      - kai-data:/app/data
      - kai-vendor:/app/vendor
      - kai-models:/app/models
    env_file: .env
    environment:
      KAI_COCKPIT_DB: postgresql+psycopg://${KAI_POSTGRES_USER}:${KAI_POSTGRES_PASSWORD}@kai-postgres:5432/${KAI_POSTGRES_DB}
    depends_on:
      kai-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - odyssey
