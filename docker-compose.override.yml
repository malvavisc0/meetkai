x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  cockpit:
    build: .
    image: meetkai-dev-cockpit
    pull_policy: never
    ports:
      - "8080:8080"
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.30
    container_name: kai-mailpit
    hostname: kai-mailpit
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - 1025
    # The web UI is an unauthenticated inbox that holds magic-link emails —
    # bind it to localhost only, never publish it on the host network.
    ports:
      - "127.0.0.1:8025:8025"
    logging: *logging
    networks:
      - odyssey
