<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Your kAI access link</title>
  </head>
  <body style="margin:0; padding:0; background:#f6f7fb; color:#111827; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; background:#f6f7fb;">
      <tr>
        <td align="center" style="padding:56px 20px 44px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:560px;">
            <tr>
              <td style="padding:0 4px 24px; color:#111827; font-size:18px; font-weight:700; letter-spacing:-0.02em;">
                kAI<span style="color:#53627c; font-size:14px; font-weight:500; letter-spacing:0;"> / operator console</span>
              </td>
            </tr>
            <tr>
              <td style="border:1px solid #e3e7ef; border-radius:12px; background:#ffffff;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;">
                  <tr>
                    <td style="height:4px; border-radius:12px 12px 0 0; background:#2954d6; font-size:0; line-height:0;">&nbsp;</td>
                  </tr>
                  <tr>
                    <td style="padding:40px 40px 36px;">
                      <p style="margin:0 0 16px; color:#53627c; font-size:12px; font-weight:700; letter-spacing:0.1em; line-height:1.3; text-transform:uppercase;">Secure sign-in</p>
                      <h1 style="margin:0; color:#111827; font-size:32px; font-weight:700; letter-spacing:-0.035em; line-height:1.12;">Open your<br>workspace.</h1>
                      <p style="margin:20px 0 0; color:#4b5568; font-size:16px; line-height:1.65;">Use this one-time link to access the Cockpit. It is valid for the next 10 minutes.</p>
                      <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:30px 0 32px;">
                        <tr>
                          <td align="center" bgcolor="#2954d6" style="border-radius:7px;">
                            <a href="{{ magic_url }}" style="display:inline-block; padding:14px 24px; color:#ffffff; font-size:15px; font-weight:700; line-height:20px; text-decoration:none;">Open Cockpit&nbsp;&nbsp;&rarr;</a>
                          </td>
                        </tr>
                      </table>
                      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;">
                        <tr>
                          <td style="padding:16px; border:1px solid #e8ebf1; border-radius:8px; background:#fafbfc;">
                            <p style="margin:0 0 8px; color:#53627c; font-size:12px; font-weight:600; line-height:1.4;">Prefer to verify the destination?</p>
                            <p style="margin:0; overflow-wrap:anywhere; color:#2954d6; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; line-height:1.55;"><a href="{{ magic_url }}" style="color:#2954d6; text-decoration:underline;">{{ magic_url }}</a></p>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 4px 0; color:#8791a5; font-size:12px; line-height:1.5; text-align:center;">Knowledgeable Artificial Intelligence</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
