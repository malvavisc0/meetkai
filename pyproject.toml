[project]
name = "kai"
version = "0.0.1"
description = "Hackable Python framework for webhook-driven LLM bots"
authors = [
    { name = "Malvavisc0", email = "207609879+malvavisc0@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer",
    "fastapi",
    "uvicorn",
    "httpx",
    "llama-index-llms-openai-like",
    "openai",
    "pydantic",
    "rich",
    "pydantic-settings",
    "pillow",
    "ddgs",
    "markdownify",
    "markdown-it-py",
    "curl-cffi",
    "beautifulsoup4",
    "jinja2",
    "python-multipart",
    "sqlalchemy",
    "alembic",
    "itsdangerous",
    "cryptography",
    "pyyaml",
    "psycopg[binary]",
    "pymysql",
    "sentry-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "pyright",
    "ruff",
]

[project.scripts]
kai = "kai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kai"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "W",
  "UP",
  "B904",
  "PIE810",
  "PERF401",
  "PERF403",
  "RET504",
  "RUF022",
  "RUF100",
  "SIM103",
  "SIM105",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
asyncio_mode = "auto"
addopts = "-n auto"
pythonpath = ["."]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
reportUnnecessaryTypeIgnoreComment = true

[tool.vulture]
paths = ["src"]
min_confidence = 60
# Framework-dispatched registrations: typer commands, FastAPI routes and
# handlers, pydantic validators/serializers, pytest fixtures. Never called
# by name from our code, so the decorator is the reference.
ignore_decorators = [
  "@*.command",
  "@*.get",
  "@*.post",
  "@*.put",
  "@*.patch",
  "@*.delete",
  "@*.exception_handler",
  "@field_validator",
  "@model_validator",
  "@field_serializer",
  "@model_serializer",
  "@computed_field",
  "@pytest.*",
]
# Names static analysis cannot resolve, grouped by reason.
ignore_names = [
  # pydantic config and pydantic/SQLAlchemy/dataclass fields populated from
  # external data, rendered by templates or the DB layer
  "model_config",
  "updated_at",
  "fulfilled_at",
  "error_msg",
  "icon",
  "help",
  "testable",
  "webhook_type",
  "min_version",
  "markdown_with_citations",
  "references_markdown",
  # agent/bot plugin API called by bot packages, not in-tree
  "observe",
  "unregister_tool",
  "clear_tools",
  "set_tool_call_callback",
  "clear_goal",
  "revision",
  "post_processing_profile",
  # bot subclass storage
  "_template",
  "_settings",
  # uvicorn / rich object configuration
  "should_exit",
  "header_style",
  # test seams that reset module state between tests
  "reset_logging",
  "clear_key_cache",
  "clear_seen_nonces",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyright",
    "respx",
    "ruff",
    "httpx2",
    "pytest-xdist",
    "pytest-cov",
]

[tool.coverage.run]
source = ["src/kai"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
